version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    groups:
      app-runtime:
        patterns:
          - react
          - react-dom
        update-types:
          - minor
          - patch
      tooling:
        patterns:
          - "*"
        exclude-patterns:
          - react
          - react-dom
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@axe-core/playwright"
        versions:
          - "4.14.0"
      - dependency-name: "@playwright/test"
        versions:
          - "1.63.x"
          - "1.64.x"
          - "1.65.x"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
        update-types:
          - minor
          - patch
